<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#111C38" />
      <stop offset="65%" stop-color="#070B18" />
      <stop offset="100%" stop-color="#040711" />
    </radialGradient>
    <linearGradient id="core-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16223D" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <filter id="neon-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Obsidian Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg-glow)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2" />

  <!-- Soft Outer Glow Behind Solid Bars -->
  <g filter="url(#neon-blur)">
    <polygon points="203.0,145.1 309.0,145.1 343.0,86.3 169.0,86.3" fill="#00F0FF" opacity="0.32" />
    <polygon points="325.5,154.7 378.5,246.5 446.5,246.5 359.5,95.8" fill="#FF0055" opacity="0.32" />
    <polygon points="378.5,265.5 325.5,357.3 359.5,416.2 446.5,265.5" fill="#FFB800" opacity="0.32" />
    <polygon points="309.0,366.9 203.0,366.9 169.0,425.7 343.0,425.7" fill="#00FF87" opacity="0.32" />
    <polygon points="186.5,357.3 133.5,265.5 65.5,265.5 152.5,416.2" fill="#00F0FF" opacity="0.32" />
    <polygon points="133.5,246.5 186.5,154.7 152.5,95.8 65.5,246.5" fill="#FF0055" opacity="0.32" />
  </g>

  <!-- 6 Distinct Solid-Color Hexagon Bars -->
  <g>
    <polygon points="203.0,145.1 309.0,145.1 343.0,86.3 169.0,86.3" fill="#00F0FF" />
    <polygon points="174.0,92.3 338.0,92.3 341.5,86.3 170.5,86.3" fill="#FFFFFF" opacity="0.22" />
    <polygon points="325.5,154.7 378.5,246.5 446.5,246.5 359.5,95.8" fill="#FF0055" />
    <polygon points="356.8,103.1 438.8,245.2 445.8,245.2 360.2,97.1" fill="#FFFFFF" opacity="0.22" />
    <polygon points="378.5,265.5 325.5,357.3 359.5,416.2 446.5,265.5" fill="#FFB800" />
    <polygon points="438.8,266.8 356.8,408.9 360.2,414.9 445.8,266.8" fill="#FFFFFF" opacity="0.22" />
    <polygon points="309.0,366.9 203.0,366.9 169.0,425.7 343.0,425.7" fill="#00FF87" />
    <polygon points="338.0,419.7 174.0,419.7 170.5,425.7 341.5,425.7" fill="#FFFFFF" opacity="0.22" />
    <polygon points="186.5,357.3 133.5,265.5 65.5,265.5 152.5,416.2" fill="#00F0FF" />
    <polygon points="155.2,408.9 73.2,266.8 66.2,266.8 151.7,414.9" fill="#FFFFFF" opacity="0.22" />
    <polygon points="133.5,246.5 186.5,154.7 152.5,95.8 65.5,246.5" fill="#FF0055" />
    <polygon points="73.2,245.2 155.2,103.1 151.8,97.1 66.2,245.2" fill="#FFFFFF" opacity="0.22" />
  </g>

  <!-- Center Slate Hexagon Core -->
  <polygon points="354.0,256.0 305.0,340.9 207.0,340.9 158.0,256.0 207.0,171.1 305.0,171.1" fill="url(#core-fill)" stroke="#00F0FF" stroke-width="4.5" stroke-linejoin="round" filter="url(#core-glow)" />
  <polygon points="334.0,256.0 295.0,323.5 217.0,323.5 178.0,256.0 217.0,188.5 295.0,188.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2" />

  <!-- Subtle Geometric Center Emblem -->
  <polygon points="236.0,226.0 288.0,256.0 236.0,286.0" fill="#FFFFFF" opacity="0.94" />
</svg>
