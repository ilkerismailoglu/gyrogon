services:
  postgres:
    image: postgres:16-alpine
    container_name: gyrogon_postgres
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gyrogon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gyrogon}
    volumes:
      - gyrogon_pgdata:/var/lib/postgresql/data
    networks:
      - gyrogon_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gyrogon} -d ${POSTGRES_DB:-gyrogon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gyrogon_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - gyrogon_redisdata:/data
    networks:
      - gyrogon_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gyrogon_backend
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      GYROGON_DOMAIN: ${GYROGON_DOMAIN:-${HEXACORE_DOMAIN:-gyrogon.com}}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://gyrogon.com,https://www.gyrogon.com}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-com.gyrogon.game}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-GYROGON <noreply@gyrogon.com>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gyrogon_internal
      - dokploy-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_ADMIN_PATH: ${VITE_ADMIN_PATH:-/gx-ctrl-9472}
    container_name: gyrogon_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - gyrogon_internal
      - dokploy-network

  backup:
    image: postgres:16-alpine
    container_name: gyrogon_backup
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gyrogon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gyrogon}
    volumes:
      - gyrogon_backups:/backups
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "echo '0 3 * * * /bin/sh /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1' > /etc/crontabs/root && crond -f -l 2"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gyrogon_internal

volumes:
  gyrogon_pgdata:
  gyrogon_redisdata:
  gyrogon_backups:

networks:
  gyrogon_internal:
    driver: bridge
  dokploy-network:
    external: true
