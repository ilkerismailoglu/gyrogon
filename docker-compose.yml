services:
  postgres:
    image: postgres:16-alpine
    container_name: gyrogon_dev_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gyrogon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gyrogon_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-gyrogon}
    ports:
      - "5432:5432"
    volumes:
      - gyrogon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyrogon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gyrogon_dev_redis
    ports:
      - "6379:6379"
    volumes:
      - gyrogon_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gyrogon_pgdata:
  gyrogon_redisdata:
